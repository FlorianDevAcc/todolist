[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todolist"
version = "0.2.0"
description = "A simple command-line todo list"
requires-python = ">=3.12"

[project.scripts]
todolist = "todolist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
